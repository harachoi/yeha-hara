    <script>
      (function () {
        var locked = false
        function lockHeroHeight() {
          if (locked) return
          var height = window.innerHeight || document.documentElement.clientHeight
          if (!height) return
          locked = true
          document.documentElement.style.setProperty('--hero-height', height + 'px')
        }
        lockHeroHeight()
        window.addEventListener('DOMContentLoaded', lockHeroHeight, { once: true })
      })()
    </script>
