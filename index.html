    <title>모바일 청첩장</title>
    <script>
      (function () {
        var locked = false
        function lockHeroAspect() {
          if (locked) return
          var width = Math.min(
            document.documentElement.clientWidth || window.innerWidth || 0,
            430,
          )
          var height = window.innerHeight || document.documentElement.clientHeight || 0
          if (!width || !height) return
          locked = true
          // Width-based aspect ratio: hero height won't change when browser chrome resizes.
          document.documentElement.style.setProperty(
            '--hero-aspect',
            width + ' / ' + height,
          )
        }
        lockHeroAspect()
        window.addEventListener('DOMContentLoaded', lockHeroAspect, { once: true })
      })()
    </script>
